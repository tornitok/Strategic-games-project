{% extends "base.html" %}
{% block body %}
<h1>{{ title }}</h1>
<p class="round">Введите код команды — его показывает ведущий на пульте.</p>
{% if error %}<p class="big">{{ error }}</p>{% endif %}
<section class="card">
  <form method="post" action="/team/{{ faction }}/login">
    <label>Код команды
      <input name="code" inputmode="numeric" autocomplete="off" autofocus>
    </label>
    <button type="submit">Войти</button>
  </form>
</section>
{% endblock %}

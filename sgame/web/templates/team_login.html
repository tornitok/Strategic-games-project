{% extends "base.html" %}
{% block body %}
<h1>{{ title }}</h1>
<p class="round">{{ t("team.enter_code") }}</p>
{% if error %}<p class="big">{{ error }}</p>{% endif %}
<section class="card">
  <form method="post" action="/team/{{ faction }}/login">
    <label>{{ t("team.code_label") }}
      <input name="code" inputmode="numeric" autocomplete="off" autofocus>
    </label>
    <button type="submit">{{ t("team.enter") }}</button>
  </form>
</section>
{% endblock %}

{% extends "base.html" %}
{% block body %}
<h1>{{ t("start.new_game") }}</h1>
<form method="post" action="/session/new">
  <label>{{ t("start.scenario") }}
    <select name="scenario">
      {% for id, title in scenarios.items() %}
      <option value="{{ id }}">{{ title }}</option>
      {% endfor %}
    </select>
  </label>
  <label>{{ t("start.seed") }}
    <input type="number" name="seed" value="{{ default_seed }}">
  </label>
  <button type="submit">{{ t("start.begin") }}</button>
</form>
{% endblock %}
